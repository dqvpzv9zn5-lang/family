<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Young Family — Ancestral Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a2e;--gold:#c8973a;--cream:#fafaf8;--faint:rgba(255,255,255,0.08);--line:rgba(255,255,255,0.12);}
html,body{height:100%;overflow:hidden;font-family:"Inter",sans-serif;background:var(--ink);}
#app{display:flex;flex-direction:column;height:100vh;}
#map{flex:1;position:relative;}
header{display:flex;align-items:center;gap:16px;padding:0 18px;height:50px;flex-shrink:0;background:rgba(26,26,46,0.98);border-bottom:1px solid var(--faint);z-index:200;position:relative;}
.brand{font-family:"Playfair Display",serif;font-size:0.95rem;color:var(--cream);}
.brand em{color:var(--gold);font-style:normal;}
.back{margin-left:auto;font-size:0.72rem;color:rgba(255,255,255,0.4);text-decoration:none;padding:4px 12px;border:1px solid var(--line);border-radius:5px;white-space:nowrap;}
.back:hover{color:var(--gold);}
#tl{flex-shrink:0;background:rgba(26,26,46,0.98);border-top:1px solid var(--faint);padding:12px 18px 10px;z-index:200;position:relative;}
.tl-row{display:flex;align-items:center;gap:14px;margin-bottom:9px;}
#pbtn{width:36px;height:36px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#pbtn:hover{background:#b5852e;}
#yr{font-family:"Playfair Display",serif;font-size:2rem;font-weight:600;color:var(--gold);min-width:76px;line-height:1;}
#inf{font-size:0.75rem;color:rgba(255,255,255,0.4);line-height:1.5;}
#inf strong{color:var(--cream);}
.spd{display:flex;gap:4px;margin-left:auto;}
.sb{background:var(--faint);border:1px solid var(--line);color:rgba(255,255,255,0.4);font-size:0.7rem;font-weight:600;padding:3px 9px;border-radius:4px;cursor:pointer;}
.sb.on,.sb:hover{background:var(--gold);color:#fff;border-color:var(--gold);}
.sl-row{display:flex;align-items:center;gap:10px;}
.sll{font-size:0.68rem;color:rgba(255,255,255,0.3);white-space:nowrap;}
#sl{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;outline:none;cursor:pointer;}
#sl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid rgba(26,26,46,0.8);}
#sl::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid rgba(26,26,46,0.8);}
#leg{position:fixed;bottom:100px;right:12px;z-index:9999;background:rgba(26,26,46,0.95);border:1px solid var(--line);border-radius:10px;padding:12px 15px;min-width:150px;pointer-events:none;}
.lt{font-size:0.67rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.li{display:flex;align-items:center;gap:8px;font-size:0.73rem;color:rgba(255,255,255,0.4);margin-bottom:4px;}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
#hov{position:fixed;top:62px;left:12px;z-index:9999;background:rgba(26,26,46,0.95);border:1px solid var(--line);border-radius:10px;padding:13px 15px;max-width:220px;font-size:0.77rem;line-height:1.55;display:none;}
#hov.show{display:block;}
#hn{font-weight:600;color:var(--cream);margin-bottom:2px;}
#hy{color:var(--gold);}
#hp{color:rgba(255,255,255,0.4);}
#stats{position:fixed;top:62px;right:12px;z-index:9999;display:flex;gap:6px;}
.pill{background:rgba(26,26,46,0.93);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:0.7rem;display:flex;align-items:center;gap:5px;color:rgba(255,255,255,0.4);}
.pill .n{font-family:"Playfair Display",serif;font-size:0.95rem;color:var(--gold);}
.leaflet-container{background:#0d1726 !important;}
.leaflet-tile{filter:brightness(0.45) saturate(0.5) hue-rotate(195deg);}
.leaflet-popup-content-wrapper{background:rgba(22,22,44,0.96);color:var(--cream);border:1px solid var(--line);border-radius:8px;}
.leaflet-popup-content{margin:10px 14px;font-size:0.78rem;line-height:1.55;}
.leaflet-popup-tip{background:rgba(22,22,44,0.96);}
.leaflet-popup-close-button{color:rgba(255,255,255,0.3) !important;}
@media(max-width:600px){.spd,.back,#leg,#stats{display:none;} #yr{font-size:1.5rem;}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">The <em>Young</em> Family &mdash; Ancestral Map</div>

    </div>
  </div>
  <div id="tl">
    <div class="tl-row">

      <div id="yr">1274</div>

    </div>
  </div>
</div>

var NOTABLES = [{"lat": 55.3173, "lng": -4.8333, "title": "Robert the Bruce (b.1274)", "sub": "Your 22nd great-grandfather \u2014 King of Scots 1306\u20131329"}, {"lat": 56.395, "lng": -3.431, "title": "Joan Stewart, Countess of Morton (b.1428)", "sub": "Your 17th great-grandmother \u2014 daughter of James I"}, {"lat": 56.072, "lng": -3.4393, "title": "James I, King of Scotland (b.1394)", "sub": "Your 18th great-grandfather \u2014 murdered at Perth 1437"}, {"lat": 55.4116, "lng": -1.7049, "title": "Elizabeth Percy (b.~1395)", "sub": "Your 21st great-grandmother \u2014 granddaughter of Henry Hotspur"}, {"lat": 50.8523, "lng": -0.5539, "title": "John FitzAlan, 14th Earl of Arundel (b.1408)", "sub": "Your 18th great-grandfather \u2014 died in the Hundred Years War"}, {"lat": 52.3833, "lng": 1.5333, "title": "Lady Elizabeth Lawrence of Rumburgh (b.1552)", "sub": "Your 14th great-grandmother \u2014 died Jamestown, Virginia 1621"}, {"lat": 56.4026, "lng": -5.0279, "title": "Sir Colin Campbell, 1st Earl of Argyll (b.1433)", "sub": "Your 17th great-grandfather \u2014 Lord High Chancellor of Scotland"}, {"lat": 55.745, "lng": -4.6933, "title": "Lord William Cunninghame, Earl of Glencairn (b.1493)", "sub": "Your 15th great-grandfather \u2014 The Notorious Intriguer"}];
var COLS = {SC:"#4a90d9", EN:"#d94a4a", IR:"#4ac47a", US:"#d9a44a", EU:"#9b59b6"};

var map = L.map("map", {center:[55.5,-3.5], zoom:6, zoomControl:true, attributionControl:false});
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {maxZoom:19}).addTo(map);

// Notable star markers
NOTABLES.forEach(function(n) {
  L.marker([n.lat, n.lng], {
    icon: L.divIcon({
      className: "",
      html: "<div style=\"font-size:18px;filter:drop-shadow(0 0 5px gold);line-height:1\">&#11088;</div>",
      iconSize: [22,22],
      iconAnchor: [11,11]
    }),
    zIndexOffset: 1000
  }).bindPopup(
    "<strong style=\"color:#c8973a\">" + n.title + "</strong><br>" +
    "<span style=\"color:rgba(255,255,255,.5)\">" + n.sub + "</span>"
  ).addTo(map);
});

// Sort people by birth year
var sorted = PEOPLE.slice().sort(function(a,b){ return a.y - b.y; });

// Use a plain array to track marker objects — NO custom properties on Leaflet objects
var grp = L.layerGroup().addTo(map);
var markers = [];   // plain Leaflet circleMarker refs
var pdata = [];     // parallel array of person data
var visible = [];   // parallel array of booleans — NEVER stored on the marker

sorted.forEach(function(p) {
  var m = L.circleMarker([p.lat, p.lng], {
    radius: 5,
    fillColor: COLS[p.c] || "#aaa",
    fillOpacity: 0,
    color: "transparent",
    weight: 0
  });
  grp.addLayer(m);
  markers.push(m);
  pdata.push(p);
  visible.push(false);

  m.on("click", function() {
    document.getElementById("hn").textContent = p.n;
    document.getElementById("hy").textContent = "Born " + p.y;
    document.getElementById("hp").textContent = p.p;
    document.getElementById("hov").classList.add("show");
  });
});

map.on("click", function() {
  document.getElementById("hov").classList.remove("show");
});

var curYear = 1274, playing = false, speed = 1, raf = null, cursor = 0, shown = 0;

var SHOW_STYLE = {fillOpacity:0.88, color:"rgba(255,255,255,.25)", weight:0.5};
var HIDE_STYLE = {fillOpacity:0, color:"transparent", weight:0};

function showUpTo(yr) {
  while (cursor < sorted.length && sorted[cursor].y <= yr) {
    markers[cursor].setStyle(SHOW_STYLE);
    visible[cursor] = true;
    shown++;
    cursor++;
  }
}

function resetTo(yr) {
  shown = 0; cursor = 0;
  for (var i = 0; i < markers.length; i++) {
    if (sorted[i].y <= yr) {
      markers[i].setStyle(SHOW_STYLE);
      visible[i] = true;
      shown++;
      cursor = i + 1;
    } else {
      markers[i].setStyle(HIDE_STYLE);
      visible[i] = false;
    }
  }
}

function updateUI() {
  document.getElementById("yr").textContent = curYear;
  document.getElementById("sl").value = curYear;
  document.getElementById("cvis").textContent = shown;
  document.getElementById("svis").textContent = shown;
  var sc = 0, en = 0;
  for (var i = 0; i < cursor; i++) {
    if (pdata[i].c === "SC") sc++;
    else if (pdata[i].c === "EN") en++;
  }
  var ot = shown - sc - en, parts = [];
  if (sc) parts.push(sc + " Scotland");
  if (en) parts.push(en + " England");
  if (ot) parts.push(ot + " other");
  document.getElementById("cloc").textContent = parts.join(" · ");
}

function setYear(yr) {
  var prev = curYear;
  curYear = Math.max(1274, Math.min(2009, Math.round(yr)));
  if (curYear >= prev) showUpTo(curYear);
  else resetTo(curYear);
  updateUI();
}

function step() {
  if (!playing) return;
  if (curYear >= 2009) {
    playing = false;
    document.getElementById("pbtn").innerHTML = "&#9654;";
    return;
  }
  setYear(curYear + speed);
  raf = requestAnimationFrame(step);
}

document.getElementById("pbtn").addEventListener("click", function() {
  if (curYear >= 2009) {
    shown = 0; cursor = 0;
    for (var i = 0; i < markers.length; i++) {
      markers[i].setStyle(HIDE_STYLE);
      visible[i] = false;
    }
    setYear(1274);
  }
  playing = !playing;
  document.getElementById("pbtn").innerHTML = playing ? "&#9646;&#9646;" : "&#9654;";
  if (playing) raf = requestAnimationFrame(step);
  else cancelAnimationFrame(raf);
});

document.getElementById("sl").addEventListener("input", function(e) {
  playing = false;
  cancelAnimationFrame(raf);
  document.getElementById("pbtn").innerHTML = "&#9654;";
  setYear(parseInt(e.target.value));
});

document.querySelectorAll(".sb").forEach(function(b) {
  b.addEventListener("click", function() {
    document.querySelectorAll(".sb").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
    speed = parseInt(b.dataset.s);
  });
});

setYear(1274);
map.fitBounds([[49.5,-8.8],[61.0,2.2]]);
})();
</script>
